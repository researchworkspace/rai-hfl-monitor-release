[project]
name = "raimon"
version = "1.0.0"
description = "Statistical monitoring of Responsible-AI requirements in hierarchical federated learning"
requires-python = ">=3.11,<3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
# Versions used for the results reported in the paper. OPA 1.22.2 is installed separately (see README).
dependencies = [
  "numpy==2.4.6",
  "pandas==3.1.1",
  "scipy==1.17.1",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "opacus==1.6.0",
  "captum==0.9.0",
  "folktables==0.0.12",
  "requests==2.34.2",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
